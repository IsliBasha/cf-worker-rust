[package]
name = "cf-worker-rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.8", features = ["http"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
jsonwebtoken = "9"

[profile.release]
opt-level = "z"
lto = true
strip = true
